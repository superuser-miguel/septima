<?xml version="1.0" encoding="UTF-8"?>
<!-- Development builds: the release icon in grey with construction stripes,
     so the two can be told apart in the app grid. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8d99"/>
      <stop offset="1" stop-color="#55555f"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4ea"/>
    </linearGradient>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#f5c211"/>
      <rect x="10" width="10" height="20" fill="#2e2e36"/>
    </pattern>
    <clipPath id="tile">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- Construction band along the bottom edge -->
  <rect x="8" y="102" width="112" height="18" fill="url(#stripes)" clip-path="url(#tile)"/>

  <!-- Archive box -->
  <g transform="translate(28 24)">
    <rect x="0" y="18" width="72" height="52" rx="7" fill="url(#lid)"/>
    <rect x="-4" y="6" width="80" height="20" rx="7" fill="#ffffff"/>
    <rect x="32" y="6" width="8" height="64" fill="#c9c9d2"/>
    <rect x="30" y="40" width="12" height="14" rx="3" fill="#55555f"/>
  </g>
</svg>
